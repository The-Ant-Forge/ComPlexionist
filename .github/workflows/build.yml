name: Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for commit count versioning

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        shell: bash
        run: |
          uv pip install --system -e ".[dev]"
          # complexionist.spec hard-fails if flet and flet-desktop disagree,
          # so pin the client to whatever flet actually resolved to.
          FLET_VERSION=$(python -c "import importlib.metadata as m; print(m.version('flet'))")
          echo "Pinning flet-desktop to $FLET_VERSION"
          uv pip install --system "flet-desktop==$FLET_VERSION"

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "from complexionist import __version__; print(__version__)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Cache Flet desktop client
        run: |
          python -c "from flet_desktop import ensure_client_cached; ensure_client_cached()"

      - name: Build executable
        run: |
          # Build from committed spec file (includes all excludes, flet desktop client bundling, icon)
          pyinstaller complexionist.spec --noconfirm

      - name: Test executable
        run: |
          dist/complexionist.exe --version
          dist/complexionist.exe --cli --help

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: complexionist-windows-${{ steps.version.outputs.version }}
          path: dist/complexionist.exe

      - name: Prepare release notes
        id: notes
        shell: bash
        run: |
          # The first line of RELEASE_NOTES.md is the release title: it already
          # carries the name, version and a summary of the change. Using it as
          # the title makes the release list scannable instead of ten identical
          # version numbers. Strip it from the body so it does not render twice.
          TITLE=$(head -1 RELEASE_NOTES.md | sed 's/^#\+[[:space:]]*//')
          if [ -z "$TITLE" ]; then
            echo "::error::RELEASE_NOTES.md has no title on line 1"
            exit 1
          fi
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "Release title: $TITLE"
          # Drop line 1, then any blank lines immediately following it.
          tail -n +2 RELEASE_NOTES.md | sed '/./,$!d' > release_body.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/complexionist.exe
          body_path: release_body.md
          name: ${{ steps.notes.outputs.title }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
